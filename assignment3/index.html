<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioCore X1</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!--
      This project is a showcase page for a fictional headphone brand, AudioCore X1. Rather than creating a fully-fledged e-commerce site, I focused on a single element—the act of scrolling itself. As the user scrolls down, the page does not simply jump to the next image; instead, it feels as though they are slowly approaching the product, opening it, and then putting it back together. As products like headphones have a relatively complex internal structure, this approach allows users to first view the complete exterior, then gradually reveal the ear cups, drivers and sound wave patterns layer by layer. This rhythm feels far more natural than simply stacking text and images.

       The page structure is kept very simple, consisting of just a main stage, a text area, a progress indicator and an SVG product image. The logic behind this choice is straightforward: the simpler the structure, the clearer the sequence of the scrolling experience. Users don’t need to learn how to operate it; they simply scroll down upon entering the page to understand the flow. The text is kept brief, as this design is more of a visual experiment in product disassembly rather than a detailed technical specification of each component. The large headline and stage numbers merely indicate to the user ‘which layer they are currently viewing’; the actual information is conveyed through the movement, disassembly, rotation and reassembly of the headphones.

    -->
    <main class="scroll-space" id="top">
      <section class="stage">
        <div class="brand">AUDIOCORE X1</div>

        <div class="copy-panel" aria-live="polite">
          <p class="step" id="stepText">01 / EXTERIOR</p>
          <h1 id="titleText">AudioCore X1</h1>
          <p class="body-text" id="bodyText">Surface to sound. Scroll to open the product layer by layer.</p>
        </div>
        <div class="progress-panel">
          <p id="modeText">SCROLL</p>
          <div class="progress-track">
            <span id="progressDot"></span>
          </div>
        </div>


        <svg class="product-svg" viewBox="0 0 1200 675" role="img" aria-label="A coded line drawing of AudioCore X1 headphones breaking apart as the page scrolls.">
          <defs>
            <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
              <circle cx="3" cy="3" r="1.3" fill="currentColor"></circle>
            </pattern>
          </defs>

          <g class="crop-guides">
            <rect x="710" y="170" width="380" height="360"></rect>
            <path d="M 710 170 L 710 135 L 770 135"></path>
            <path d="M 1090 530 L 1090 565 L 1030 565"></path>
            <circle cx="900" cy="350" r="8"></circle>
          </g>


          <g class="whole-headset">
            <path class="line thick" d="M 390 420 C 420 130, 780 130, 810 420"></path>
            <path class="line light" d="M 430 420 C 455 185, 745 185, 770 420"></path>
            <path class="line dotted-arc" d="M 455 405 C 475 225, 725 225, 745 405"></path>

            <path class="line" d="M 420 408 L 435 475"></path>
            <path class="line" d="M 780 408 L 765 475"></path>
            <rect class="line fill-white" x="360" y="390" width="110" height="56" rx="12"></rect>
            <rect class="line fill-white" x="730" y="390" width="110" height="56" rx="12"></rect>

            <g class="left-cup">
              <ellipse class="line fill-white" cx="350" cy="510" rx="92" ry="132"></ellipse>
              <ellipse class="line light fill-white" cx="350" cy="510" rx="65" ry="100"></ellipse>
              <path class="line light" d="M 405 432 C 435 480, 435 545, 405 600"></path>
              <rect class="line" x="415" y="512" width="16" height="58" rx="8"></rect>
            </g>
            <g class="right-cup">
              <ellipse class="line fill-white" cx="850" cy="510" rx="92" ry="132"></ellipse>
              <ellipse class="line light fill-white" cx="850" cy="510" rx="65" ry="100"></ellipse>

              <path class="line light" d="M 795 432 C 765 480, 765 545, 795 600"></path>
              <rect class="line" x="769" y="512" width="16" height="58" rx="8"></rect>
              <text x="843" y="525" class="cup-letter">A</text>
            </g>
          </g>

          <g class="explode-set">
            <g class="part shell">
              <ellipse class="line fill-white" cx="850" cy="505" rx="92" ry="132"></ellipse>
              <ellipse class="line light" cx="850" cy="505" rx="64" ry="98"></ellipse>
              <text x="843" y="520" class="cup-letter">A</text>

            </g>
            <g class="part cushion">
              <ellipse class="line fill-white" cx="725" cy="505" rx="60" ry="100"></ellipse>
              <ellipse class="line" cx="725" cy="505" rx="36" ry="70"></ellipse>
              <ellipse class="dots-fill" cx="725" cy="505" rx="58" ry="98"></ellipse>
            </g>
            <g class="part plate">
              <ellipse class="line fill-white" cx="600" cy="505" rx="48" ry="86"></ellipse>
              <ellipse class="line light" cx="600" cy="505" rx="28" ry="54"></ellipse>
              <circle class="line light" cx="600" cy="430" r="5"></circle>
              <circle class="line light" cx="600" cy="580" r="5"></circle>


            </g>
            <g class="part driver-core">
              <ellipse class="red-line fill-none" cx="475" cy="505" rx="58" ry="92"></ellipse>
              <ellipse class="red-line fill-none" cx="475" cy="505" rx="38" ry="62"></ellipse>
              <circle class="red-line fill-none" cx="475" cy="505" r="24"></circle>
              <g class="driver-fins">
                <path d="M 475 443 C 506 462, 508 548, 475 567"></path>
                <path d="M 445 452 C 486 470, 488 540, 445 558"></path>
                <path d="M 505 452 C 464 470, 462 540, 505 558"></path>

                <path d="M 430 505 C 455 475, 495 475, 520 505"></path>
                <path d="M 430 505 C 455 535, 495 535, 520 505"></path>
              </g>
            </g>
            <g class="part back-ring">
              <ellipse class="line fill-white" cx="365" cy="505" rx="38" ry="68"></ellipse>
              <ellipse class="line light" cx="365" cy="505" rx="20" ry="38"></ellipse>
            </g>
          </g>

          <g class="driver-focus">
            <circle class="red-line" cx="690" cy="350" r="140"></circle>
            <circle class="red-line light-red" cx="690" cy="350" r="185"></circle>
            <circle class="red-line light-red" cx="690" cy="350" r="230"></circle>
            <circle class="red-line" cx="690" cy="350" r="72"></circle>

            <g class="driver-rays">
              <path d="M690 210 C760 250 760 450 690 490"></path>
              <path d="M620 225 C710 260 710 440 620 475"></path>
              <path d="M760 225 C670 260 670 440 760 475"></path>

              <path d="M555 350 C610 280 770 280 825 350"></path>
              <path d="M555 350 C610 420 770 420 825 350"></path>
            </g>
          </g>

          <g class="waves">
            <path id="noiseWave" class="wave black-wave" d=""></path>
            <path id="cancelWave" class="wave red-wave" d=""></path>
            <path id="quietWave" class="wave quiet-wave" d=""></path>
          </g>

          <g class="labels">
            <g class="label label-shell">
              <circle cx="850" cy="270" r="5"></circle>
              <path d="M850 270 L850 230"></path>
              <text x="820" y="215">SHELL</text>

            </g>
            <g class="label label-cushion">
              <circle cx="720" cy="270" r="5"></circle>
              <path d="M720 270 L720 230"></path>
              <text x="675" y="215">CUSHION</text>
            </g>

            <g class="label label-driver">
              <circle cx="475" cy="270" r="5"></circle>
              <path d="M475 270 L475 230"></path>
              <text x="440" y="215">DRIVER</text>
            </g>
          </g>
        </svg>

      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
